name: EGX Telegram Live Alerts & Daily Report

on:
  schedule:
    # Runs every 5 minutes during EGX trading hours (08:00 - 12:55 UTC = 10:00 - 14:55 Cairo Time, Sun-Thu)
    - cron: '*/5 8-12 * * 0-4'
    # Runs at 13:15 UTC (15:15 Cairo Time, Sun-Thu) for the End-of-Day Daily Report
    - cron: '15 13 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-egx-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas git+https://github.com/rongardF/tvdatafeed.git

      - name: Run Telegram Alerts & Daily Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USER: ${{ secrets.TV_USER }}
          TV_PASS: ${{ secrets.TV_PASS }}
        run: |
          python telegram_alerts.py auto

      - name: Save alert state to prevent duplicates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f telegram_alert_state.json ]; then
            git add telegram_alert_state.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update telegram alert state" && git push)
          fi
