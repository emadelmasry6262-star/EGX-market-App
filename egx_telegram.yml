name: EGX Telegram Live Alerts & Daily Report

on:
  schedule:
    # Runs every 15 minutes during EGX trading hours (08:00 - 12:45 UTC = 10:00 - 14:45 Cairo Time, Sun-Thu)
    - cron: '*/15 8-12 * * 0-4'
    # Runs at 13:00 UTC (15:00 Cairo Time, Sun-Thu) for the Afternoon Daily Report
    - cron: '0 13 * * 0-4'
    # Runs at 20:00 UTC (22:00 Cairo Time, Sun-Thu) for the Evening Daily Report
    - cron: '0 20 * * 0-4'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'نوع التشغيل اليدوي (اختر manual_intraday لملخص لحظي فوري أثناء الجلسة)'
        required: true
        default: 'manual_intraday'
        type: choice
        options:
          - manual_intraday
          - auto
          - daily_report

permissions:
  contents: write

jobs:
  run-egx-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas matplotlib requests websocket-client git+https://github.com/rongardF/tvdatafeed.git

      - name: Run Telegram Alerts & Daily Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_USER: ${{ secrets.TV_USER }}
          TV_PASS: ${{ secrets.TV_PASS }}
          INPUT_RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          MODE="${INPUT_RUN_MODE:-auto}"
          echo "Running mode: $MODE"
          python telegram_alerts.py "$MODE"

      - name: Save alert state to prevent duplicates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f telegram_alert_state.json ]; then
            git add telegram_alert_state.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update telegram alert state" && git push)
          fi
